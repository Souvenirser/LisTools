<!doctype html>
<html lang="zh-CN">
<head>
  <script src="/theme-init.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title data-i18n="common.convert">编码与转换 · LisTools</title>
  <link rel="icon" href="/icons/icon-48.png" />
</head>
<body class="convert-page" data-layout="editor">
  <header class="app-header">
    <button type="button" class="brand" data-i18n-aria-label="common.navigation"><span class="brand-mark">Li</span>LisTools<span class="brand-caret" aria-hidden="true">▾</span></button>
    <span class="header-divider"></span><span class="header-description" data-i18n="common.toolbox">实用工具箱</span>
  </header>
  <div class="app-layout">
    <main>
      <section class="page-heading"><div><h1 data-i18n="common.convert">编码与转换</h1><p data-convert="description"></p></div><button id="convert-catalog-toggle" type="button" data-i18n="office.chooseTask" aria-controls="convert-catalog" aria-expanded="false"></button><span class="keyboard-hint"><kbd>Ctrl / ⌘</kbd> + <kbd>Enter</kbd></span></section>
      <div class="convert-layout">
        <aside id="convert-catalog" class="convert-catalog panel" data-i18n-aria-label="common.convert">
          <div class="convert-catalog-header"><h2 data-i18n="common.tools">工具</h2><label class="sr-only" for="convert-search" data-i18n="common.search">搜索</label><input id="convert-search" type="search" data-i18n-placeholder="common.search" autocomplete="off" spellcheck="false" /></div>
          <nav id="convert-tool-list" data-i18n-aria-label="common.convert"></nav>
          <p id="convert-no-tools" data-i18n="menu.noResults" hidden></p>
        </aside>
        <section class="convert-workbench">
          <div class="convert-tool-heading"><h2 id="tool-title"></h2><p id="tool-hint"></p></div>
          <form id="tool-options" class="convert-options" autocomplete="off"></form>
          <div class="convert-actions toolbar">
            <button id="convert-run" class="primary" data-convert="run"></button><button id="convert-cancel" data-convert="cancel" disabled></button>
            <label class="check-label"><input id="convert-auto" type="checkbox" checked /><span data-convert="auto"></span></label>
            <span class="toolbar-spacer"></span><button id="convert-clear" class="quiet" data-convert="clear"></button>
          </div>
          <div class="convert-editors">
            <section class="panel" id="convert-input-panel">
              <div class="panel-heading"><h2 data-convert="input"></h2><select id="input-mode" aria-label="输入类型"><option value="text" data-convert="text"></option><option value="file" data-convert="file"></option></select><button id="choose-file" data-convert="chooseFile"></button><input id="convert-file" type="file" hidden /></div>
              <div class="convert-editor" id="convert-source"></div>
              <div class="panel-footer"><span id="convert-input-info"></span><button id="input-search" class="quiet" data-convert="searchText"></button></div>
            </section>
            <section class="panel output-panel" id="convert-output-panel" data-status="idle">
              <div class="panel-heading"><h2 data-convert="output"></h2><div class="convert-result-actions toolbar"><button id="result-to-input" data-convert="reuse" disabled></button><button id="convert-copy" data-convert="copy" disabled></button><button id="convert-download" data-convert="download" disabled></button></div><button id="output-search" class="quiet" data-convert="searchText"></button></div>
              <div id="convert-color" hidden></div>
              <div class="convert-editor" id="convert-result"></div>
              <div class="panel-footer"><span id="preview-info"></span><span id="convert-output-info"></span></div>

            </section>
          </div>
          <p id="convert-status" role="status" aria-live="polite"></p>
          <details id="convert-error-detail" hidden><summary data-i18n="cron.technicalDetails"></summary><pre id="convert-error-raw" dir="ltr"></pre></details>
          <p id="convert-notice" role="note"></p>
          <button id="convert-locate" hidden data-convert="locate"></button>
        </section>
      </div>
      <footer class="workbench-footer"><span data-i18n="common.privacy">数据仅在本地处理，不上传、不保存输入内容。</span><span data-convert="limits"></span></footer>
    </main>
  </div>
  <div id="convert-drop-overlay" class="file-drop-overlay" hidden><strong data-convert="drop"></strong><span data-convert="dropHint"></span></div>
  <div id="notification" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/src/convert.js"></script>
</body>
</html>
