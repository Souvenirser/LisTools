<!doctype html>
<html data-entry="support" lang="zh-CN">
<head>
  <link rel="stylesheet" href="/boot.css" />
  <script src="./boot-labels.js"></script>
  <script src="/theme-init.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>请作者喝咖啡 · LisTools</title>
  <link rel="icon" href="/icons/icon-48.png" />
</head>
<body data-entry="support" class="tool-page support-page" data-layout="focus">
  <header class="app-header">
    <button type="button" class="brand" data-i18n-aria-label="common.navigation"><span class="brand-mark">Li</span>LisTools<span class="brand-caret" aria-hidden="true">▾</span></button>
    <span class="header-divider"></span><span class="header-description" data-i18n="common.toolbox">实用工具箱</span>
  </header>
  <div class="app-layout">
    <main class="support-main">
      <section class="tool-card" id="support-card">
        <span class="support-coffee" aria-hidden="true">☕</span>
        <h1 data-i18n="support.title">请作者喝咖啡</h1>
        <p data-i18n="support.description">如果 LisTools 帮到了你，欢迎请作者喝杯咖啡。</p>
        <p class="support-amount" data-i18n="support.amount">金额随心</p>
        <figure class="support-code">
          <img id="support-qr" src="/support/alipay.png" width="288" data-i18n-alt="support.qrAlt" alt="作者的支付宝收款二维码" />
          <figcaption data-i18n="support.scan">使用支付宝扫码后自行输入金额。</figcaption>
        </figure>
        <p data-i18n="support.voluntary">完全自愿，不支持也可以正常使用全部功能。</p>
        <p class="support-privacy" data-i18n="support.privacy">付款由支付宝处理，扩展不读取或保存支付信息。</p>
      </section>
    </main>
  </div>
  <script type="module" src="/src/entry.js"></script>
</body>
</html>
